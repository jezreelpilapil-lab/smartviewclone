<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <title>SmartView - Stream Movies & TV Shows</title>
    <link rel="icon" href="../icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-card: #222222;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #e50914;
            --accent-hover: #f40612;
            --border-color: #3a3a3a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            padding: 4px 8px;
            cursor: pointer;
            line-height: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .logo img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 10px 40px 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .search-bar::placeholder {
            color: var(--text-secondary);
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: var(--bg-secondary);
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            padding: 14px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        /* Main Content */
        .main-content {
            padding: 0;
            min-height: 50vh;
        }

        .content-section {
            padding: 20px 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        @media (min-width: 768px) {
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 16px;
            }
        }

        .content-card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .content-card:hover {
            transform: scale(1.05);
        }

        .card-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-poster-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-size: 48px;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .content-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            font-size: 40px;
            color: white;
        }

        .card-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
        }

        .loading-spinner {
            font-size: 48px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* Info Box */
        .info-box {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            margin: 20px 16px;
            border-radius: 10px;
            text-align: center;
        }

        .info-box h2 {
            margin-bottom: 12px;
        }

        .info-box p {
            margin-bottom: 16px;
            line-height: 1.5;
        }

        .info-box button {
            background: rgba(255,255,255,0.2);
            border: 2px solid white;
            color: white;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .info-box button:hover {
            background: white;
            color: #667eea;
        }

        .setup-steps {
            text-align: left;
            background: rgba(0,0,0,0.2);
            padding: 16px;
            border-radius: 8px;
            margin-top: 16px;
        }

        .setup-steps ol {
            margin-left: 20px;
            line-height: 1.8;
        }

        .demo-button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            margin-top: 12px;
        }

        .demo-button:hover {
            background: var(--accent-hover);
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.5);
            transition: left 0.3s;
            z-index: 200;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            line-height: 1;
        }

        .menu-section {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .menu-icon {
            font-size: 22px;
            width: 24px;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 150;
        }

        .overlay.show {
            display: block;
        }

        @media (max-width: 768px) {
            .logo span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo">
            <img src="../icon.png" alt="SmartView">
            <span>SmartView</span>
        </div>
        <div class="search-container">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search movies & TV shows...">
            <button class="search-btn" onclick="handleSearch()">🔍</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('home')">Home</button>
        <button class="nav-tab" onclick="switchTab('movies')">Movies</button>
        <button class="nav-tab" onclick="switchTab('shows')">TV Shows</button>
        <button class="nav-tab" onclick="switchTab('trending')">Trending</button>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <div class="info-box">
            <h2>🎬 Welcome to SmartView Web</h2>
            <p>Stream thousands of movies and TV shows on any device!</p>
            <p style="font-size: 14px; opacity: 0.9;">
                This web app requires a free API setup to stream real content.<br>
                Don't worry - it takes less than 2 minutes!
            </p>
            <button onclick="showSetupGuide()">📖 Setup Guide (2 minutes)</button>
            <button class="demo-button" onclick="loadDemoContent()">▶️ Try Demo Content First</button>
        </div>
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="../icon.png" alt="SmartView">
                <span style="font-size: 1.3em; font-weight: 600;">SmartView</span>
            </div>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        
        <div class="menu-section">
            <div class="menu-item" onclick="switchTab('home'); toggleSidebar();">
                <span class="menu-icon">🏠</span>
                <span>Home</span>
            </div>
            <div class="menu-item" onclick="switchTab('movies'); toggleSidebar();">
                <span class="menu-icon">🎬</span>
                <span>Movies</span>
            </div>
            <div class="menu-item" onclick="switchTab('shows'); toggleSidebar();">
                <span class="menu-icon">📺</span>
                <span>TV Shows</span>
            </div>
            <div class="menu-item" onclick="switchTab('trending'); toggleSidebar();">
                <span class="menu-icon">🔥</span>
                <span>Trending</span>
            </div>
        </div>

        <div class="menu-section">
            <div class="menu-item" onclick="showSetupGuide(); toggleSidebar();">
                <span class="menu-icon">⚙️</span>
                <span>Setup Guide</span>
            </div>
            <div class="menu-item" onclick="showAbout(); toggleSidebar();">
                <span class="menu-icon">ℹ️</span>
                <span>About</span>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <script src="watch.js"></script>
</body>
</html>
