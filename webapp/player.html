<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SmartView Player</title>
    <link rel="icon" href="../icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #000;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        .player-container {
            width: 100vw;
            height: 100vh;
            position: relative;
            background: #000;
        }

        video, iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .player-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
            padding: 16px;
            display: flex;
            align-items: center;
            gap: 16px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .player-container:hover .player-header {
            opacity: 1;
        }

        .back-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            font-size: 24px;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .player-title {
            font-size: 18px;
            font-weight: 600;
        }

        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            z-index: 50;
        }

        .loading-spinner {
            font-size: 64px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            margin-top: 20px;
            font-size: 18px;
            color: #999;
        }

        .error-container {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            text-align: center;
        }

        .error-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .error-title {
            font-size: 24px;
            margin-bottom: 12px;
        }

        .error-message {
            color: #999;
            margin-bottom: 24px;
            line-height: 1.5;
        }

        .error-button {
            background: #e50914;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
        }

        .error-button:hover {
            background: #f40612;
        }
    </style>
</head>
<body>
    <div class="player-container" id="playerContainer">
        <div class="player-header">
            <button class="back-btn" onclick="goBack()">←</button>
            <div class="player-title" id="playerTitle">Now Playing</div>
        </div>

        <div class="loading" id="loading">
            <div class="loading-spinner">⏳</div>
            <div class="loading-text">Loading video...</div>
        </div>

        <div id="videoPlayer"></div>
    </div>

    <script>
        // Get URL parameters
        const params = new URLSearchParams(window.location.search);
        const videoUrl = params.get('url');
        const title = params.get('title') || 'Now Playing';
        const type = params.get('type') || 'direct';

        // Set title
        document.getElementById('playerTitle').textContent = title;
        document.title = title + ' - SmartView';

        // Load video
        function loadVideo() {
            if (!videoUrl) {
                showError('No video URL provided');
                return;
            }

            const videoPlayer = document.getElementById('videoPlayer');
            const loading = document.getElementById('loading');

            if (type === 'embed') {
                // Embedded iframe
                videoPlayer.innerHTML = `<iframe src="${videoUrl}" allowfullscreen allow="autoplay; encrypted-media"></iframe>`;
                loading.style.display = 'none';
            } else {
                // Direct video
                videoPlayer.innerHTML = `
                    <video controls autoplay controlsList="nodownload">
                        <source src="${videoUrl}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                `;

                const video = videoPlayer.querySelector('video');
                
                video.addEventListener('loadeddata', () => {
                    loading.style.display = 'none';
                });

                video.addEventListener('error', () => {
                    showError('Failed to load video. The source may be unavailable.');
                });
            }
        }

        // Show error
        function showError(message) {
            const playerContainer = document.getElementById('playerContainer');
            document.getElementById('loading').style.display = 'none';
            
            playerContainer.innerHTML += `
                <div class="error-container">
                    <div class="error-icon">⚠️</div>
                    <div class="error-title">Unable to Load Video</div>
                    <div class="error-message">${message}</div>
                    <button class="error-button" onclick="goBack()">Go Back</button>
                </div>
            `;
        }

        // Go back
        function goBack() {
            if (document.referrer && document.referrer.includes(window.location.host)) {
                window.history.back();
            } else {
                window.location.href = 'watch.html';
            }
        }

        // Initialize
        loadVideo();

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' || e.key === 'Backspace') {
                goBack();
            }
            
            const video = document.querySelector('video');
            if (video) {
                if (e.key === ' ') {
                    e.preventDefault();
                    video.paused ? video.play() : video.pause();
                }
                if (e.key === 'ArrowLeft') {
                    video.currentTime -= 10;
                }
                if (e.key === 'ArrowRight') {
                    video.currentTime += 10;
                }
                if (e.key === 'f') {
                    if (!document.fullscreenElement) {
                        document.documentElement.requestFullscreen();
                    } else {
                        document.exitFullscreen();
                    }
                }
            }
        });
    </script>
</body>
</html>
