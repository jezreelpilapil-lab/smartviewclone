            ]
        };

        function testSearch() {
            const query = document.getElementById('searchInput').value.trim();
            const searchTerm = query.toLowerCase();
            const allContent = [];
            
            // Gather all content
            for (let category in contentDatabase) {
                if (Array.isArray(contentDatabase[category])) {
                    allContent.push(...contentDatabase[category]);
                } else {
                    for (let subcat in contentDatabase[category]) {
                        if (Array.isArray(contentDatabase[category][subcat])) {
                            allContent.push(...contentDatabase[category][subcat]);
                        }
                    }
                }
            }
            
            // Filter
            const results = allContent.filter(item => 
                item.title.toLowerCase().includes(searchTerm) ||
                item.genre.toLowerCase().includes(searchTerm) ||
                item.year.includes(searchTerm)
            );
            
            // Display status
            document.getElementById('status').innerHTML = `
                📊 Searched for: "${query}"<br>
                📚 Total content: ${allContent.length} items<br>
                ✅ Results found: ${results.length} items
            `;
            
            // Display results
            if (results.length === 0) {
                document.getElementById('results').innerHTML = '<div class="item">❌ No results found</div>';
            } else {
                document.getElementById('results').innerHTML = results.map(item => `
                    <div class="item">
                        ${item.emoji} <strong>${item.title}</strong><br>
                        ${item.genre} • ${item.year} • ⭐ ${item.rating}
                    </div>
                `).join('');
            }
        }

        function showAll() {
            document.getElementById('searchInput').value = '';
            testSearch();
        }

        // Allow Enter key
        document.getElementById('searchInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') testSearch();
        });

        // Auto-run test on load
        window.addEventListener('load', () => {
            document.getElementById('status').innerHTML = '✅ Content database loaded! Try searching above.';
        });
