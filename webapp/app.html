<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a1a">
    <meta name="description" content="SmartView - Fast Browsing & Privacy Protection">
    <title>SmartView</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="../icon.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-card: #222222;
            --text-primary: #ffffff;
            --text-secondary: #b3b3b3;
            --accent: #e50914;
            --accent-hover: #f40612;
            --border-color: #3a3a3a;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica', 'Arial', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        /* Header */
        .header {
            background: var(--bg-secondary);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .menu-btn {
            background: none;
            border: none;
            color: white;
            font-size: 28px;
            padding: 4px 8px;
            cursor: pointer;
            line-height: 1;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.2em;
            font-weight: 600;
        }

        .logo img {
            width: 36px;
            height: 36px;
            border-radius: 8px;
        }

        .search-container {
            flex: 1;
            max-width: 500px;
            position: relative;
        }

        .search-bar {
            width: 100%;
            padding: 10px 40px 10px 14px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 14px;
            background: var(--bg-card);
            color: var(--text-primary);
        }

        .search-bar::placeholder {
            color: var(--text-secondary);
        }

        .search-btn {
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            padding: 5px 10px;
        }

        .icon-btns {
            display: flex;
            gap: 4px;
        }

        .icon-btn {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 22px;
            padding: 6px 10px;
        }

        /* Navigation Tabs */
        .nav-tabs {
            background: var(--bg-secondary);
            display: flex;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-tabs::-webkit-scrollbar {
            display: none;
        }

        .nav-tab {
            padding: 14px 20px;
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            white-space: nowrap;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
        }

        .nav-tab.active {
            color: var(--text-primary);
            border-bottom-color: var(--accent);
        }

        /* Main Content */
        .main-content {
            padding: 0;
        }

        /* Video Player */
        .video-container {
            background: #000;
            position: relative;
            display: none;
        }

        .video-container.show {
            display: block;
        }

        .video-player {
            width: 100%;
            aspect-ratio: 16/9;
            background: #000;
            position: relative;
        }

        .video-player video,
        .video-player iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        .video-controls {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
            padding: 40px 16px 16px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .video-container:hover .video-controls {
            opacity: 1;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: rgba(255,255,255,0.3);
            margin-bottom: 12px;
            cursor: pointer;
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: var(--accent);
            width: 0%;
        }

        .controls-row {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .control-btn {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 8px;
        }

        .time-display {
            color: white;
            font-size: 13px;
        }

        .spacer {
            flex: 1;
        }

        /* Content Grid */
        .content-section {
            padding: 20px 16px;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .section-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .see-all {
            color: var(--accent);
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        .content-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 12px;
        }

        @media (min-width: 768px) {
            .content-grid {
                grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
                gap: 16px;
            }
        }

        .content-card {
            cursor: pointer;
            transition: transform 0.2s;
        }

        .content-card:hover {
            transform: scale(1.05);
        }

        .card-poster {
            width: 100%;
            aspect-ratio: 2/3;
            background: var(--bg-card);
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
        }

        .card-poster img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .play-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .content-card:hover .play-overlay {
            opacity: 1;
        }

        .play-icon {
            font-size: 40px;
            color: white;
        }

        .card-title {
            margin-top: 8px;
            font-size: 14px;
            font-weight: 500;
            line-height: 1.3;
            overflow: hidden;
            text-overflow: ellipsis;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .card-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: -280px;
            top: 0;
            width: 280px;
            height: 100vh;
            background: var(--bg-secondary);
            box-shadow: 4px 0 12px rgba(0, 0, 0, 0.5);
            transition: left 0.3s;
            z-index: 200;
            overflow-y: auto;
        }

        .sidebar.open {
            left: 0;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
        }

        .sidebar-logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .sidebar-logo img {
            width: 40px;
            height: 40px;
            border-radius: 10px;
        }

        .sidebar-title {
            font-size: 1.3em;
            font-weight: 600;
        }

        .close-btn {
            background: none;
            border: none;
            color: white;
            font-size: 32px;
            cursor: pointer;
            padding: 0;
            line-height: 1;
        }

        .menu-section {
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 14px 20px;
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
            transition: background 0.2s;
        }

        .menu-item:hover {
            background: rgba(255,255,255,0.1);
        }

        .menu-icon {
            font-size: 22px;
            width: 24px;
            text-align: center;
        }

        .menu-label {
            font-size: 15px;
        }

        .version-info {
            position: fixed;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            color: #666;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            z-index: 1000;
        }

        /* Overlay */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            z-index: 150;
        }

        .overlay.show {
            display: block;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-container {
                max-width: none;
            }
            
            .logo span {
                display: none;
            }
        }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <button class="menu-btn" onclick="toggleSidebar()">☰</button>
        <div class="logo">
            <img src="../icon.png" alt="SmartView">
            <span>SmartView</span>
        </div>
        <div class="search-container">
            <input type="text" class="search-bar" id="searchInput" placeholder="Search movies, shows, or enter URL...">
            <button class="search-btn" onclick="handleSearch()">🔍</button>
        </div>
        <div class="icon-btns">
            <button class="icon-btn" onclick="showBookmarks()" title="Bookmarks">⭐</button>
            <button class="icon-btn" onclick="showHistory()" title="History">🕒</button>
        </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="nav-tabs">
        <button class="nav-tab active" onclick="switchTab('home', this)">Home</button>
        <button class="nav-tab" onclick="switchTab('movies', this)">Movies</button>
        <button class="nav-tab" onclick="switchTab('shows', this)">TV Shows</button>
        <button class="nav-tab" onclick="switchTab('anime', this)">Anime</button>
        <button class="nav-tab" onclick="switchTab('trending', this)">Trending</button>
        <button class="nav-tab" onclick="switchTab('browse', this)">Browse</button>
    </div>

    <!-- Video Player -->
    <div class="video-container" id="videoContainer">
        <div class="video-player" id="videoPlayer"></div>
        <div class="video-controls">
            <div class="progress-bar" onclick="seek(event)">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="controls-row">
                <button class="control-btn" id="playPauseBtn" onclick="playPause()">▶️</button>
                <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
                <div class="spacer"></div>
                <button class="control-btn" onclick="toggleMute()">🔊</button>
                <button class="control-btn" onclick="toggleFullscreen()">⛶</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Content sections will be dynamically loaded here -->
    </div>

    <!-- Sidebar -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">
                <img src="../icon.png" alt="SmartView">
                <span class="sidebar-title">SmartView</span>
            </div>
            <button class="close-btn" onclick="toggleSidebar()">×</button>
        </div>
        
        <div class="menu-section">
            <div class="menu-item" onclick="switchTab('home'); toggleSidebar();">
                <span class="menu-icon">🏠</span>
                <span class="menu-label">Home</span>
            </div>
            <div class="menu-item" onclick="switchTab('movies'); toggleSidebar();">
                <span class="menu-icon">🎬</span>
                <span class="menu-label">Movies</span>
            </div>
            <div class="menu-item" onclick="switchTab('shows'); toggleSidebar();">
                <span class="menu-icon">📺</span>
                <span class="menu-label">TV Shows</span>
            </div>
            <div class="menu-item" onclick="switchTab('anime'); toggleSidebar();">
                <span class="menu-icon">🎌</span>
                <span class="menu-label">Anime</span>
            </div>
        </div>

        <div class="menu-section">
            <div class="menu-item" onclick="showBookmarks(); toggleSidebar();">
                <span class="menu-icon">⭐</span>
                <span class="menu-label">Bookmarks</span>
            </div>
            <div class="menu-item" onclick="showHistory(); toggleSidebar();">
                <span class="menu-icon">🕒</span>
                <span class="menu-label">History</span>
            </div>
            <div class="menu-item" onclick="showDownloads(); toggleSidebar();">
                <span class="menu-icon">📥</span>
                <span class="menu-label">Downloads</span>
            </div>
        </div>

        <div class="menu-section">
            <div class="menu-item" onclick="showSettings(); toggleSidebar();">
                <span class="menu-icon">⚙️</span>
                <span class="menu-label">Settings</span>
            </div>
            <div class="menu-item" onclick="showAbout(); toggleSidebar();">
                <span class="menu-icon">ℹ️</span>
                <span class="menu-label">About</span>
            </div>
        </div>
    </div>

    <!-- Overlay -->
    <div class="overlay" id="overlay" onclick="closeAll()"></div>

    <!-- Version Info -->
    <div class="version-info">v1.1 • 50 titles loaded</div>

    <script src="app.js?v=1.1"></script>
</body>
</html>
